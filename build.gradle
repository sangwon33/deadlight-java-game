buildscript {
  repositories {
    mavenCentral()
    gradlePluginPortal()
    mavenLocal()
    google()
    maven { url = 'https://central.sonatype.com/repository/maven-snapshots/' }
  }
  dependencies {


  }
}

allprojects {
  apply plugin: 'eclipse'
  apply plugin: 'idea'

  // This allows you to "Build and run using IntelliJ IDEA", an option in IDEA's Settings.
  idea {
    module {
      outputDir = file('build/classes/java/main')
      testOutputDir = file('build/classes/java/test')
    }
  }
}

def assetsDirectory = layout.projectDirectory.dir('assets')
def assetListFile = assetsDirectory.file('assets.txt')
def listedAssets = fileTree(assetsDirectory.asFile) {
  exclude 'assets.txt', '**/.lwjgl/**'
}
def generateAssetList = tasks.register('generateAssetList') {
  inputs.files(listedAssets).withPathSensitivity(PathSensitivity.RELATIVE)
  outputs.file(assetListFile)
  doLast {
    def assetPaths = listedAssets.files.collect { file ->
      assetsDirectory.asFile.toPath().relativize(file.toPath()).toString().replace('\\', '/')
    }.sort()
    assetListFile.asFile.setText(assetPaths.join('\n') + '\n', 'UTF-8')
  }
}

configure(subprojects) {
  apply plugin: 'java-library'
  java.sourceCompatibility = 17
  java.targetCompatibility = 17

  tasks.named('processResources') {
    dependsOn(generateAssetList)
  }

  compileJava {
    options.incremental = true
  }
}

subprojects {
  version = "$projectVersion"
  ext.appName = 'Deadlight'
  repositories {
    mavenCentral()
    // You may want to remove the following line if you have errors downloading dependencies.
    mavenLocal()
    maven { url = 'https://central.sonatype.com/repository/maven-snapshots/' }
    maven { url = 'https://jitpack.io' }
  }
}

eclipse.project.name = 'Deadlight'

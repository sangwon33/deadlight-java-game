services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: deadlight
      MYSQL_USER: deadlight
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD}
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - deadlight-db:/var/lib/mysql
volumes:
  deadlight-db:
